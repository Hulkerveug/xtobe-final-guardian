[package]
name = "xtobe-final-guardian"
version = "2.1.0"
description = "Xtobe Final Guardian - offline AI defense core with sandboxed emulator"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
dirs = "5"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
sys-locale = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
